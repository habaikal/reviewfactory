[supervisord]
nodaemon=true
[program:vllm]
command=python3 -m vllm.entrypoints.openai.api_server --model Qwen/Qwen2.5-32B-Instruct --served-model-name qwen3 --dtype auto --max-model-len 12288 --quantization fp8 --port 8001 --api-key %(ENV_VLLM_API_KEY)s
autorestart=true
[program:comfyui]
command=python3 /app/ComfyUI/main.py --listen 0.0.0.0 --port 8188 --enable-cors-header *
autorestart=true
[program:backend]
command=uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
directory=/app/backend
autorestart=true
[program:remotion]
command=node server.js
directory=/app/remotion
autorestart=true
[program:frontend]
command=npm run start -- -p 3000
directory=/app/frontend
autorestart=true
